[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-ladder"
version = "0.1.0"
description = "Cumulative harness-engineering powers on one agent loop (MiniCPM5-2B primary)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ever Olivares" }]
keywords = ["llm", "agent", "harness", "eval", "feature-flags"]
dependencies = [
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/everolivares/harness-ladder"
Documentation = "PLAN.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
